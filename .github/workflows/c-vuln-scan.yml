name: C Vulnerability Scan

on:
  push:
    paths:
      - 'Devign/C-Vul-Devign/**/*.c'
      - 'Devign/C-Vul-Devign/**/*.h'
  pull_request:
    paths:
      - 'Devign/C-Vul-Devign/**/*.c'
      - 'Devign/C-Vul-Devign/**/*.h'
  workflow_dispatch:
    inputs:
      file:
        description: 'Optional C file path to scan'
        required: false
        default: ''

jobs:
  scan:
    name: Scan C files for vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    defaults:
      run:
        working-directory: Devign/C-Vul-Devign

    steps:
      - name: Checkout repository (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'Devign/C-Vul-Devign/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify model files exist
        run: |
          echo "Checking model files..."
          for file in models/best_v2_seed42.pt models/vocab.json models/config.json; do
            if [ -f "$file" ]; then
              echo "✓ Found: $file ($(du -h "$file" | cut -f1))"
            else
              echo "✗ Missing: $file"
              exit 1
            fi
          done

      - name: Determine C files to scan
        id: files
        shell: bash
        run: |
          set -euo pipefail

          # Manual run with specific file
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.file }}" ]]; then
            echo "files=${{ github.event.inputs.file }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get changed files based on event type
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            echo "Unsupported event: ${{ github.event_name }}" >&2
            exit 1
          fi

          # Handle initial commit (no before SHA)
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            ALL_FILES=$(git ls-files 'Devign/C-Vul-Devign/' || true)
          else
            ALL_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
          fi

          # Filter only .c and .h files in Devign/C-Vul-Devign/
          CHANGED_FILES=$(echo "$ALL_FILES" | grep -E '^Devign/C-Vul-Devign/.*\.(c|h)$' || true)

          # Convert to relative paths (remove Devign/C-Vul-Devign/ prefix)
          if [[ -n "$CHANGED_FILES" ]]; then
            RELATIVE_FILES=$(echo "$CHANGED_FILES" | sed 's|^Devign/C-Vul-Devign/||')
            echo "Changed C files:"
            echo "$RELATIVE_FILES"
            FILES_LINE=$(echo "$RELATIVE_FILES" | tr '\n' ' ' | xargs)
            echo "files=$FILES_LINE" >> "$GITHUB_OUTPUT"
          else
            echo "No changed C files to scan."
            echo "files=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run vulnerability scan
        id: scan
        if: steps.files.outputs.files != ''
        shell: bash
        run: |
          set -euo pipefail

          FILES="${{ steps.files.outputs.files }}"
          echo "============================================"
          echo "🔍 Scanning files: $FILES"
          echo "============================================"

          FAILED=0
          SCANNED=0
          VULNERABLE=0

          for file in $FILES; do
            if [[ ! -f "$file" ]]; then
              echo "::warning file=Devign/C-Vul-Devign/$file::File not found (may have been deleted)"
              continue
            fi

            echo ""
            echo "📄 Analyzing: $file"
            echo "--------------------------------------------"
            
            set +e
            python -m devign_pipeline.cli.analyze_file \
              --file "$file" \
              --github-annotations \
              --path-prefix "Devign/C-Vul-Devign/"
            EXIT_CODE=$?
            set -e

            SCANNED=$((SCANNED + 1))

            case $EXIT_CODE in
              0)
                echo "✅ $file is clean."
                ;;
              1)
                echo "❌ $file is VULNERABLE."
                VULNERABLE=$((VULNERABLE + 1))
                FAILED=1
                ;;
              2)
                echo "::error file=Devign/C-Vul-Devign/$file::Analyzer input error (exit 2) - check file path or type."
                ;;
              *)
                echo "::error file=Devign/C-Vul-Devign/$file::Analyzer crashed with exit code $EXIT_CODE."
                exit $EXIT_CODE
                ;;
            esac
          done

          echo ""
          echo "============================================"
          echo "📊 SCAN SUMMARY"
          echo "============================================"
          echo "Files scanned: $SCANNED"
          echo "Vulnerable:    $VULNERABLE"
          echo "Clean:         $((SCANNED - VULNERABLE))"
          echo "============================================"
          
          echo "vulnerable=$VULNERABLE" >> "$GITHUB_OUTPUT"

          if [[ $FAILED -ne 0 ]]; then
            echo ""
            echo "⚠️  One or more vulnerable files detected."
            echo "Please review the annotations above and fix the security issues."
          else
            echo ""
            echo "✅ All scanned files are clean."
          fi

      - name: Generate SARIF report
        if: steps.files.outputs.files != ''
        continue-on-error: true
        run: |
          FILES="${{ steps.files.outputs.files }}"
          python -m devign_pipeline.cli.generate_sarif \
            --files $FILES \
            --output results.sarif \
            --path-prefix "Devign/C-Vul-Devign/" || true
          
          if [ -f "results.sarif" ]; then
            echo "SARIF report generated:"
            head -50 results.sarif
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: steps.files.outputs.files != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: Devign/C-Vul-Devign/results.sarif
          category: "devign-vulnerability-scan"

      - name: No C files changed
        if: steps.files.outputs.files == ''
        run: |
          echo "ℹ️  No C/H files changed in this commit/PR."
          echo "Skipping vulnerability scan."

      - name: Fail if vulnerabilities found
        if: steps.scan.outputs.vulnerable != '' && steps.scan.outputs.vulnerable != '0'
        run: |
          echo "❌ Vulnerabilities detected! Failing the build."
          exit 1
